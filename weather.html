<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather</title><style>:root{--bg:#2e2e2e;--fg:#fff;--mut:#b5b5b5}*{box-sizing:border-box}html,body{margin:0;height:100%}body{display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;text-align:center}.big{font-size:clamp(32px,12vw,60px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05}.sub{color:var(--mut);margin-top:4px;font-size:13px}.bar{height:6px;background:#ffffff26;border-radius:3px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:#fff}input{background:#3a3a3a;color:#fff;border:1px solid #555;border-radius:4px}button{background:#fff;color:#2e2e2e;border:0;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;margin:3px}.n{font-size:15px;font-weight:600;margin-top:8px}.u{color:var(--mut);text-transform:uppercase;letter-spacing:.2em;font-size:11px}</style></head><body><div><div class="big" id="t">--</div><div class="sub" id="c">Slough</div><div class="sub" id="f"></div></div>
<script>const W={0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",48:"Fog",51:"Drizzle",53:"Drizzle",55:"Drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",71:"Snow",73:"Snow",75:"Heavy snow",80:"Showers",81:"Showers",82:"Heavy showers",95:"Thunderstorm"};
fetch("https://api.open-meteo.com/v1/forecast?latitude=51.51&longitude=-0.59&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FLondon&forecast_days=1").then(r=>r.json()).then(j=>{t.textContent=Math.round(j.current.temperature_2m)+"°C";c.textContent="Slough · "+(W[j.current.weather_code]||"");f.textContent=`H ${Math.round(j.daily.temperature_2m_max[0])}° L ${Math.round(j.daily.temperature_2m_min[0])}° · rain ${j.daily.precipitation_probability_max[0]}%`}).catch(()=>{c.textContent="Weather unavailable"})</script></body></html>
