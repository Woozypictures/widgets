<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clock</title><style>:root{--bg:#2e2e2e;--fg:#fff;--mut:#b5b5b5}*{box-sizing:border-box}html,body{margin:0;height:100%}body{display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;text-align:center}.big{font-size:clamp(32px,12vw,60px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05}.sub{color:var(--mut);margin-top:4px;font-size:13px}.bar{height:6px;background:#ffffff26;border-radius:3px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:#fff}input{background:#3a3a3a;color:#fff;border:1px solid #555;border-radius:4px}button{background:#fff;color:#2e2e2e;border:0;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;margin:3px}.n{font-size:15px;font-weight:600;margin-top:8px}.u{color:var(--mut);text-transform:uppercase;letter-spacing:.2em;font-size:11px}</style></head><body><div><div class="big" id="t"></div><div class="sub" id="d"></div></div>
<script>function u(){const n=new Date(),o={timeZone:"Europe/London"};t.textContent=n.toLocaleTimeString("en-GB",{...o,hour:"2-digit",minute:"2-digit"});d.textContent=n.toLocaleDateString("en-GB",{...o,weekday:"long",day:"numeric",month:"long"})}u();setInterval(u,1000)</script></body></html>
