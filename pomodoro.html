<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pomodoro</title><style>:root{--bg:#2e2e2e;--fg:#fff;--mut:#b5b5b5}*{box-sizing:border-box}html,body{margin:0;height:100%}body{display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;text-align:center}.big{font-size:clamp(32px,12vw,60px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05}.sub{color:var(--mut);margin-top:4px;font-size:13px}.bar{height:6px;background:#ffffff26;border-radius:3px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:#fff}input{background:#3a3a3a;color:#fff;border:1px solid #555;border-radius:4px}button{background:#fff;color:#2e2e2e;border:0;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;margin:3px}.n{font-size:15px;font-weight:600;margin-top:8px}.u{color:var(--mut);text-transform:uppercase;letter-spacing:.2em;font-size:11px}</style></head><body><div><div class="sub" id="m">Focus</div><div class="big" id="t">25:00</div><div><button id="s">Start</button><button id="r">Reset</button><button id="k">Switch</button></div><div class="sub" id="n">Sessions today: 0</div></div>
<script>let mode=0,L=[25*60,5*60],left=L[0],iv=null,n=0,key="pomo"+new Date().toDateString();try{n=+localStorage.getItem(key)||0}catch(e){}
function show(){t.textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0");m.textContent=mode?"Break":"Focus";document.title=t.textContent}
function cnt(){document.getElementById("n").textContent="Sessions today: "+n}
function tick(){left--;if(left<=0){clearInterval(iv);iv=null;s.textContent="Start";if(!mode){n++;try{localStorage.setItem(key,n)}catch(e){}cnt()}mode=1-mode;left=L[mode]}show()}
s.onclick=()=>{if(iv){clearInterval(iv);iv=null;s.textContent="Start"}else{iv=setInterval(tick,1000);s.textContent="Pause"}};
r.onclick=()=>{clearInterval(iv);iv=null;s.textContent="Start";left=L[mode];show()};
k.onclick=()=>{clearInterval(iv);iv=null;s.textContent="Start";mode=1-mode;left=L[mode];show()};cnt();show()</script></body></html>
