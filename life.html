<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Life stats</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:#2e2e2e;color:#fff;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center}#w{width:94%;max-width:640px;padding:6px}.r{display:flex;align-items:center;gap:12px;margin:7px 0}.t{flex:1;height:18px;border:3px solid #fff;border-radius:9px;padding:2px}.t i{display:block;height:100%;background:#fff;border-radius:5px}.l{width:118px;font-size:15px;white-space:nowrap}#bw{display:none;font-size:13px;color:#b5b5b5;text-align:center;margin-bottom:6px}input{background:#3a3a3a;color:#fff;border:1px solid #555;border-radius:4px}</style></head><body><div id="w"><div id="bw"><label>Birthday <input type="date" id="b"></label></div><div id="o"></div></div>
<script>
function row(n,p,id){p=Math.max(0,Math.min(100,p));return `<div class="r"><div class="t"><i style="width:${p}%"></i></div><div class="l" ${id||""}>${n}: ${Math.round(p)}%</div></div>`}
function r(){const n=new Date(),y=n.getFullYear(),q=Math.floor(n.getMonth()/3),
yp=(n-new Date(y,0,1))/(new Date(y+1,0,1)-new Date(y,0,1))*100,
qp=(n-new Date(y,q*3,1))/(new Date(y,q*3+3,1)-new Date(y,q*3,1))*100,
mp=(n-new Date(y,n.getMonth(),1))/(new Date(y,n.getMonth()+1,1)-new Date(y,n.getMonth(),1))*100,
dow=(n.getDay()+6)%7,ws=new Date(y,n.getMonth(),n.getDate()-dow),wp=(n-ws)/(7*864e5)*100,
dp=(n-new Date(y,n.getMonth(),n.getDate()))/864e5*100;
let v="";try{v=localStorage.getItem("dob")||""}catch(e){}
document.getElementById("bw").style.display=v?"none":"block";
let h="";if(v){b.value=v;const d=new Date(v);h+=row("Life",(n-d)/(80*365.25*864e5)*100,'id="lw"')}
h+=row(y,yp).replace(`${y}:`,"Year:")+row("Quarter",qp)+row("Month",mp)+row("Week",wp)+row("Day",dp);
o.innerHTML=h;const lw=document.getElementById("lw");if(lw)lw.ondblclick=()=>{document.getElementById("bw").style.display="block"}}
b.onchange=()=>{try{localStorage.setItem("dob",b.value)}catch(e){}r()};r();setInterval(r,60000)</script></body></html>
