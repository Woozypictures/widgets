<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Life stats</title><style>:root{--bg:#2e2e2e;--fg:#fff;--mut:#b5b5b5}*{box-sizing:border-box}html,body{margin:0;height:100%}body{display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;text-align:center}.big{font-size:clamp(32px,12vw,60px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05}.sub{color:var(--mut);margin-top:4px;font-size:13px}.bar{height:6px;background:#ffffff26;border-radius:3px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:#fff}input{background:#3a3a3a;color:#fff;border:1px solid #555;border-radius:4px}button{background:#fff;color:#2e2e2e;border:0;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;margin:3px}.n{font-size:15px;font-weight:600;margin-top:8px}.u{color:var(--mut);text-transform:uppercase;letter-spacing:.2em;font-size:11px}</style></head><body><div style="width:min(300px,90vw);text-align:left;font-size:13px"><div id="o"></div><div class="sub" id="bw" style="margin-top:8px"><label>Birthday <input type="date" id="b"></label></div></div>
<script>
function bar(l,p,x,id){return `<div ${id||""}>${l}<span style="float:right;color:var(--mut)">${x}</span></div><div class="bar"><i style="width:${p}%"></i></div>`}
function r(){const n=new Date(),y=n.getFullYear(),s=new Date(y,0,1),e=new Date(y+1,0,1),yp=(n-s)/(e-s)*100,q=Math.floor(n.getMonth()/3),qs=new Date(y,q*3,1),qe=new Date(y,q*3+3,1),qp=(n-qs)/(qe-qs)*100,ms=new Date(y,n.getMonth(),1),me=new Date(y,n.getMonth()+1,1),mp=(n-ms)/(me-ms)*100;
let h=bar(y,yp,Math.ceil((e-n)/864e5)+" days left")+bar("Q"+(q+1),qp,Math.ceil((qe-n)/864e5)+" days left")+bar("Month",mp,Math.ceil((me-n)/864e5)+" days left");
let v="";try{v=localStorage.getItem("dob")||""}catch(e){}
bw.style.display=v?"none":"block";
if(v){b.value=v;const d=new Date(v),wk=Math.floor((n-d)/6048e5);h=bar("Life in weeks (to 80)",Math.min(100,wk/4160*100),wk.toLocaleString()+" of 4,160",'id="lw"')+h}
o.innerHTML=h;const lw=document.getElementById("lw");if(lw)lw.ondblclick=()=>{bw.style.display="block"}}
b.onchange=()=>{try{localStorage.setItem("dob",b.value)}catch(e){}r()};r()</script></body></html>
